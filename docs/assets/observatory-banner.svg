<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-labelledby="obTitle obDesc" font-family="Georgia, 'Times New Roman', serif">
  <title id="obTitle">MythicMind, the observatory of NPC minds</title>
  <desc id="obDesc">A ridge observatory whose telescope points at four labelled behaviour readouts: consistency, goals, safety, and latency. It marks the two toolchains that meet here, a Python evaluation lens and a .NET encounter runtime.</desc>

  <rect width="800" height="240" fill="#0e1420"/>

  <!-- horizon band -->
  <rect x="0" y="176" width="800" height="64" fill="#141c2c"/>
  <line x1="0" y1="176" x2="800" y2="176" stroke="#26324a" stroke-width="1.5"/>

  <!-- fixed reference stars, no glow, plain marks -->
  <g fill="#d7c48a">
    <circle cx="120" cy="46" r="1.6"/>
    <circle cx="210" cy="74" r="1.2"/>
    <circle cx="330" cy="38" r="1.8"/>
    <circle cx="470" cy="60" r="1.3"/>
    <circle cx="150" cy="110" r="1.1"/>
  </g>

  <!-- observatory dome, brass and slate -->
  <g transform="translate(96 176)">
    <rect x="-56" y="-40" width="112" height="40" fill="#1c2740"/>
    <path d="M -50 -40 A 50 34 0 0 1 50 -40 Z" fill="#2a3a5c"/>
    <line x1="-50" y1="-40" x2="50" y2="-40" stroke="#3d517a" stroke-width="1"/>
    <!-- open slit -->
    <rect x="-5" y="-70" width="10" height="34" fill="#0e1420"/>
    <!-- telescope aimed at the readouts, fixed angle -->
    <line x1="0" y1="-52" x2="150" y2="-96" stroke="#c99a3f" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-52" r="4" fill="#c99a3f"/>
  </g>

  <!-- four behaviour readouts the telescope charts -->
  <g font-size="11" fill="#0e1420" text-anchor="middle">
    <g transform="translate(300 66)">
      <rect x="-52" y="-15" width="104" height="26" rx="3" fill="#8ec7a0"/>
      <text y="4">consistency</text>
    </g>
    <g transform="translate(300 104)">
      <rect x="-52" y="-15" width="104" height="26" rx="3" fill="#8ec7a0"/>
      <text y="4">goals</text>
