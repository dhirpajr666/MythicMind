<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="ecTitle ecDesc" font-family="Consolas, 'Courier New', monospace">
  <title id="ecTitle">MythicMind four-axis weighted score</title>
  <desc id="ecDesc">A data-flow diagram. One fixture, a persona plus a dialogue trace, is scored on four axes with fixed weights (consistency 0.30, goals 0.30, safety 0.30, latency 0.10) that combine into one weighted overall score between zero and one.</desc>

  <rect width="720" height="320" fill="#0e1420"/>

  <!-- source fixture -->
  <g transform="translate(60 160)">
    <rect x="-44" y="-40" width="88" height="80" rx="4" fill="#1c2740" stroke="#c99a3f" stroke-width="1.5"/>
    <text x="0" y="-8" text-anchor="middle" font-size="12" fill="#f0ead6">fixture</text>
    <text x="0" y="10" text-anchor="middle" font-size="9" fill="#8aa0c4">persona</text>
    <text x="0" y="24" text-anchor="middle" font-size="9" fill="#8aa0c4">+ trace</text>
  </g>

  <!-- edges from fixture into the four axes, dashed motion shows the trace being read -->
  <g stroke="#3d517a" stroke-width="1.6" fill="none">
    <path d="M104 140 C 190 90, 220 70, 300 70"/>
    <path d="M104 150 C 190 120, 220 120, 300 120"/>
    <path d="M104 170 C 190 180, 220 180, 300 180"/>
    <path d="M104 180 C 190 210, 220 230, 300 230"/>
  </g>
  <g stroke="#8ec7a0" stroke-width="1.6" fill="none" stroke-dasharray="4 10">
    <path d="M104 140 C 190 90, 220 70, 300 70"><animate attributeName="stroke-dashoffset" from="140" to="0" dur="3s" repeatCount="indefinite"/></path>
    <path d="M104 150 C 190 120, 220 120, 300 120"><animate attributeName="stroke-dashoffset" from="140" to="0" dur="3.4s" repeatCount="indefinite"/></path>
    <path d="M104 170 C 190 180, 220 180, 300 180"><animate attributeName="stroke-dashoffset" from="140" to="0" dur="3.1s" repeatCount="indefinite"/></path>
    <path d="M104 180 C 190 210, 220 230, 300 230"><animate attributeName="stroke-dashoffset" from="140" to="0" dur="3.7s" repeatCount="indefinite"/></path>
  </g>

  <!-- the four axis cells, weight printed on each -->
  <g font-size="12" text-anchor="middle">
    <g transform="translate(360 70)">
      <rect x="-60" y="-18" width="120" height="36" rx="3" fill="#1c2740" stroke="#8ec7a0" stroke-width="1.5"/>
      <text x="0" y="-1" fill="#f0ead6">consistency</text>
      <text x="0" y="13" fill="#8aa0c4" font-size="10">weight 0.30</text>
    </g>
    <g transform="translate(360 120)">
      <rect x="-60" y="-18" width="120" height="36" rx="3" fill="#1c2740" stroke="#8ec7a0" stroke-width="1.5"/>
      <text x="0" y="-1" fill="#f0ead6">goals</text>
