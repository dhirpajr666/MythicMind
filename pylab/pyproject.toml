[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mythicmind"
version = "1.0.0"
description = "Explainable, stdlib-only AI NPC behaviour evaluation lab (Python side of MythicMind)."
readme = "../README.md"
requires-python = ">=3.10"
license = { file = "../LICENSE" }
authors = [{ name = "MythicMind contributors" }]
keywords = ["npc", "ai", "evaluation", "game-ai", "dialogue", "heuristics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
]
# Deliberately zero runtime dependencies: the lab is stdlib-only by design.
dependencies = []

[project.scripts]
mythicmind = "mythicmind.cli:main"

