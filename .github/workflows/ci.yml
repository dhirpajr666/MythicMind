name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-lens:
    name: Python lens
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax-check the package
        run: python -m compileall pylab/mythicmind
      - name: Run batch evaluation over example fixtures
        working-directory: pylab
        run: python -m mythicmind batch ../examples/fixtures
      - name: Emit JSON report (smoke)
        working-directory: pylab
        run: python -m mythicmind batch ../examples/fixtures --json > /dev/null

  dotnet-lens:
    name: C# runtime lens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - name: Build runtime (Release)
        run: dotnet build -c Release runtime/MythicMind.Runtime.csproj
      - name: Deterministic replay check
        run: |
          dotnet run -c Release --project runtime -- replay-check examples/encounters/the-night-gate.json
          dotnet run -c Release --project runtime -- replay-check examples/encounters/market-haggle.json
