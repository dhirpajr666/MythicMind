name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-lens:
    name: Python lens
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax-check the package
        run: python -m compileall pylab/mythicmind
      - name: Run batch evaluation over example fixtures
        working-directory: pylab
        run: python -m mythicmind batch ../examples/fixtures
